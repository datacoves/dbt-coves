[tox]
envlist = dbt111,dbtlatest
isolated_build = true
skip_missing_interpreters = true

setenv =
    COVERAGE_FILE = .coverage.{envname}

# dbt-core 1.1.0 (the previous floor pin) has no wheels newer than cp310 for
# its transitive deps (snowflake-connector-python etc.), so it can't build on
# current Python. Pinned at 1.11 instead, kept separate from dbtlatest below
# so there's still an older track alongside the current one.
[testenv:dbt111]
basepython = python3.12
passenv = *
# dbt-coves itself only requires dbt-core>=1.1,<2.0, so installing the
# package (a separate pip invocation from `deps` below) is otherwise free to
# upgrade dbt-core/its adapters past the pins above. The constraints file
# forces that install step to respect the same pins.
install_command = python -m pip install -c {toxinidir}/tests/tox-constraints/dbt111.txt {opts} {packages}
deps=
    dbt-core==1.11.12
    dbt-postgres==1.11.0
    dbt-bigquery==1.11.3
    dbt-snowflake==1.11.6
    redshift-connector
    pytest
    coverage
    apache-airflow==2.10.0
    kubernetes

allowlist_externals =
    echo
    pytest
commands =
    pytest --cov-report=xml:coverage-reports/dbt111-coverage.xml --cov-report term-missing  --cov=dbt_coves tests/
    coverage report -m

# Floating on the newest dbt-core/adapters below 2.0, rather than a pinned
# version, so this env automatically picks up new dbt-core releases (e.g. 1.12)
# instead of needing a manual version bump every time.
[testenv:dbtlatest]
basepython = python3.12
passenv = *
deps=
    dbt-core<2
    dbt-postgres<2
    dbt-bigquery<2
    dbt-snowflake<2
    redshift-connector
    pytest
    coverage
    apache-airflow==2.10.0
    kubernetes
allowlist_externals =
    echo
    pytest
commands =
    pytest --cov-report=xml:coverage-reports/dbtlatest-coverage.xml --cov-report term-missing  --cov=dbt_coves tests/
    coverage report -m

[gh-actions]
python =
    3.12: py312

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    windows-latest: windows
