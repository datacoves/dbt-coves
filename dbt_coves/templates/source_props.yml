version: 2

sources:
  - name: {{ source.name }}
{%- if source_database %}
    database: {{ source_database }}
{%- endif %}
{%- if source.quote_schema %}
    quoting:
      schema: true
{%- endif %}
    tables:
      - name: {{ source.table }}
{%- if source.quote_identifier %}
        quoting:
          identifier: true
{%- endif %}
        description: ""
